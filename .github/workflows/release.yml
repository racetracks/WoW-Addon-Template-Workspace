# Publishes a GitHub release whenever the version in $ADDON/$ADDON.toc changes
# on main: tags v<version> and attaches $ADDON-<version>.zip (every addon folder
# $ADDON and $ADDON_*, readme.txt and history.txt inside $ADDON; no .github or
# tools), with that version's section of history.txt as the notes. Does nothing
# if the release exists. Versions with a suffix (1.0.0-dev004) are pre-releases.
# A production release (no suffix) is also published on $MIRROR_REPO with
# the same zip and Claude-summarized notes covering every build since the
# previous production release (job "mirror"). Secrets: MIRROR_TOKEN (contents
# read and write on $MIRROR_REPO), ANTHROPIC_API_KEY (optional; without it
# the notes are the plain list of changes).
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  ADDON: MyAddon   # main folder / TOC name
  MIRROR_REPO: racetracks/WoW-Addon-Template   # where production releases are mirrored

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Read version
        id: v
        run: |
          ver=$(sed -n 's/^## Version: *//p' "$ADDON/$ADDON.toc" | tr -d '\r')
          echo "version=$ver" >> "$GITHUB_OUTPUT"
          if gh release view "v$ver" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Build zip and notes
        if: steps.v.outputs.exists == 'false'
        run: |
          ver=${{ steps.v.outputs.version }}
          mkdir -p build
          for d in "$ADDON" "$ADDON"_*/; do
            if [ -d "$d" ]; then cp -r "${d%/}" build/; fi
          done
          cp readme.txt history.txt "build/$ADDON/"
          (cd build && zip -qr "../$ADDON-$ver.zip" .)
          {
            echo "**Install:** extract the zip into \`World of Warcraft/_retail_/Interface/AddOns/\`."
            echo
            echo "### Changes"
            awk -v v="$ver" '
              index($0, "=> " v " ") == 1 { on = 1; next }
              on && /^=> / { exit }
              on { print }
            ' history.txt
            echo
            echo "Full changelog: history.txt"
          } > notes.md

      - name: Publish release
        if: steps.v.outputs.exists == 'false'
        run: |
          ver=${{ steps.v.outputs.version }}
          pre=""
          case "$ver" in *-*) pre="--prerelease" ;; esac
          gh release create "v$ver" "$ADDON-$ver.zip" $pre \
            --target "$GITHUB_SHA" --title "$ADDON $ver" --notes-file notes.md
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Mark suffixed releases as pre-releases
        run: |
          gh release list --limit 100 --json tagName,isPrerelease \
            --jq '.[] | select(.isPrerelease | not) | .tagName | select(contains("-"))' |
          while read -r tag; do gh release edit "$tag" --prerelease; done
        env:
          GH_TOKEN: ${{ github.token }}

  mirror:
    needs: release
    if: ${{ needs.release.outputs.version != '' && !contains(needs.release.outputs.version, '-') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check the mirror
        id: m
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::Add a MIRROR_TOKEN secret with contents read and write on $MIRROR_REPO"
            exit 1
          fi
          if gh release view "v$VER" --repo "$MIRROR_REPO" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          VER: ${{ needs.release.outputs.version }}
          GH_TOKEN: ${{ secrets.MIRROR_TOKEN }}

      - name: Fetch the zip
        if: steps.m.outputs.exists == 'false'
        run: gh release download "v$VER" --pattern "$ADDON-$VER.zip"
        env:
          VER: ${{ needs.release.outputs.version }}
          GH_TOKEN: ${{ github.token }}

      - name: Write the notes
        if: steps.m.outputs.exists == 'false'
        run: |
          sh tools/collect_notes.sh "$VER" > sections.txt
          {
            echo "**Install:** extract the zip into \`World of Warcraft/_retail_/Interface/AddOns/\`."
            echo
            sh tools/summarize_notes.sh "$VER" sections.txt
          } > notes.md
          cat notes.md
        env:
          VER: ${{ needs.release.outputs.version }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Publish on the mirror
        if: steps.m.outputs.exists == 'false'
        run: |
          gh release create "v$VER" "$ADDON-$VER.zip" --repo "$MIRROR_REPO" \
            --title "$ADDON $VER" --notes-file notes.md --latest
        env:
          VER: ${{ needs.release.outputs.version }}
          GH_TOKEN: ${{ secrets.MIRROR_TOKEN }}
